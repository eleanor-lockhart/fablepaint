[project]
name = "fablepaint"
version = "0.2.0"
description = "Paint programs, a production pipeline (backlot) and styles for an agent artist"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python-headless", "pillow", "OpenEXR>=3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backlot"]
